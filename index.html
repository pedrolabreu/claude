<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://script.google.com https://script.googleusercontent.com; connect-src 'self' https://script.google.com https://script.googleusercontent.com;">
    <title>Dashboard Emisfera | Comercial, Marketing & Financeiro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* DARK MODE - VERDE EMISFERA */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a140b;
            background-attachment: fixed;
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                repeating-linear-gradient(45deg, transparent, transparent 35px, rgba(130, 160, 2, 0.05) 35px, rgba(130, 160, 2, 0.05) 70px),
                repeating-linear-gradient(-45deg, transparent, transparent 35px, rgba(181, 217, 9, 0.03) 35px, rgba(181, 217, 9, 0.03) 70px);
            pointer-events: none;
            z-index: 0;
        }

        #app {
            position: relative;
            z-index: 1;
            height: 100vh;
            overflow: hidden;
        }

        /* HEADER HORIZONTAL COMPACTO */
        .header-bar {
            background: rgba(13, 27, 14, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(130, 160, 2, 0.2);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .logo-header {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: bold;
            color: #b5d909;
            letter-spacing: 0.5px;
        }

        .logo-subtitle {
            font-size: 0.7rem;
            color: rgba(181, 217, 9, 0.7);
            font-weight: 500;
            letter-spacing: 1px;
        }

        /* NAVEGAÇÃO */
        .nav-buttons {
            display: flex;
            gap: 8px;
        }

        .nav-button {
            cursor: pointer;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .nav-button:hover {
            transform: translateY(-2px);
        }

        .nav-button.active {
            background: linear-gradient(135deg, #82a002, #b5d909);
            color: #0a140b;
            box-shadow: 0 4px 12px rgba(181, 217, 9, 0.3);
        }

        .nav-button:not(.active) {
            background: rgba(26, 45, 20, 0.6);
            color: rgba(181, 217, 9, 0.8);
            border: 1px solid rgba(130, 160, 2, 0.25);
        }

        /* HEADER RIGHT */
        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .month-selector {
            background: rgba(26, 45, 20, 0.8);
            color: #e8f5e0;
            border: 1px solid rgba(130, 160, 2, 0.3);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            outline: none;
        }

        .month-selector:focus {
            border-color: #b5d909;
            box-shadow: 0 0 0 2px rgba(181, 217, 9, 0.2);
        }

        .update-btn {
            background: rgba(181, 217, 9, 0.15);
            color: #b5d909;
            border: 1px solid rgba(181, 217, 9, 0.3);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .update-btn:hover {
            background: rgba(181, 217, 9, 0.25);
            box-shadow: 0 0 12px rgba(181, 217, 9, 0.2);
        }

        .last-update {
            font-size: 0.7rem;
            color: rgba(181, 217, 9, 0.5);
        }

        /* MAIN CONTENT AREA */
        .content-area {
            height: calc(100vh - 70px);
            overflow-y: auto;
            padding: 20px;
        }

        .content-area::-webkit-scrollbar {
            width: 8px;
        }

        .content-area::-webkit-scrollbar-track {
            background: rgba(26, 45, 20, 0.3);
        }

        .content-area::-webkit-scrollbar-thumb {
            background: rgba(130, 160, 2, 0.5);
            border-radius: 4px;
        }

        /* CARDS GLASSMORPHISM */
        .card {
            background: rgba(26, 45, 20, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(130, 160, 2, 0.25);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        .card-value {
            font-size: 3rem;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(181, 217, 9, 0.15);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.95; }
        }

        .card-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(181, 217, 9, 0.6);
            font-weight: 600;
        }

        /* FUNIL */
        .funil-bar {
            background: rgba(26, 45, 20, 0.6);
            border-radius: 8px;
            padding: 12px 20px;
            margin-bottom: 10px;
            border-left: 4px solid;
            transition: all 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .funil-bar:hover {
            transform: translateX(5px);
            box-shadow: 0 0 20px rgba(181, 217, 9, 0.15);
        }

        .funil-label {
            font-size: 1rem;
            color: #e8f5e0;
            font-weight: 600;
        }

        .funil-value {
            font-size: 1.8rem;
            font-weight: bold;
            text-shadow: 0 0 12px rgba(181, 217, 9, 0.2);
        }

        .funil-taxa {
            font-size: 0.9rem;
            color: rgba(181, 217, 9, 0.7);
            margin-left: 12px;
        }

        /* PROGRESS BAR */
        .progress-wrapper {
            background: rgba(13, 27, 14, 0.6);
            border-radius: 8px;
            height: 8px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            border-radius: 8px;
            box-shadow: 0 0 8px currentColor;
            transition: width 1s ease;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // URL da API (Vercel Serverless Function)
        const API_URL = '/api/dados';

        const monthsAvailable = [
            'maio/2025', 'junho/2025', 'julho/2025', 'agosto/2025',
            'setembro/2025', 'outubro/2025', 'novembro/2025', 'dezembro/2025',
            'janeiro/2026', 'fevereiro/2026', 'marco/2026', 'abril/2026',
            'maio/2026', 'junho/2026', 'julho/2026', 'agosto/2026',
            'setembro/2026', 'outubro/2026', 'novembro/2026', 'dezembro/2026'
        ];

        const monthNames = {
            'maio/2025': 'Maio', 'junho/2025': 'Junho', 'julho/2025': 'Julho', 'agosto/2025': 'Agosto',
            'setembro/2025': 'Setembro', 'outubro/2025': 'Outubro', 'novembro/2025': 'Novembro', 'dezembro/2025': 'Dezembro',
            'janeiro/2026': 'Janeiro', 'fevereiro/2026': 'Fevereiro', 'marco/2026': 'Março', 'abril/2026': 'Abril',
            'maio/2026': 'Maio', 'junho/2026': 'Junho', 'julho/2026': 'Julho', 'agosto/2026': 'Agosto',
            'setembro/2026': 'Setembro', 'outubro/2026': 'Outubro', 'novembro/2026': 'Novembro', 'dezembro/2026': 'Dezembro'
        };

        // Determina o mês padrão com base na data atual
        function getDefaultMonth() {
            const now = new Date();
            const monthKeys = [
                'janeiro', 'fevereiro', 'marco', 'abril', 'maio', 'junho',
                'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'
            ];
            const key = monthKeys[now.getMonth()] + '/' + now.getFullYear();
            return monthsAvailable.includes(key) ? key : monthsAvailable[monthsAvailable.length - 1];
        }

        let selectedMonth = getDefaultMonth();
        let sheetData = null;
        let loading = false;
        let loadError = false;
        let lastUpdate = new Date();
        let currentPage = 'comercial'; // 'comercial', 'marketing' ou 'financeiro'

        async function loadSheetData() {
            loading = true;
            loadError = false;
            render();
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 15000);
                const response = await fetch(API_URL, { signal: controller.signal });
                clearTimeout(timeoutId);
                sheetData = await response.json();
                lastUpdate = new Date();
            } catch (error) {
                console.error('Erro ao carregar dados:', error);
                loadError = true;
            }
            loading = false;
            render();
        }

        function getCurrentMonthData() {
            const defaultData = {
                ligacoesRealizadas: 0, ligacoesAtendidas: 0,
                formularioRespondido: 0, analisePositiva: 0, vendas: 0,
                investimento: 0, visitantes: 0, cadastros: 0, mqls: 0,
                respostaFormulario: 0, analisePositivaMarketing: 0,
                pitchsAgendados: 0, pitchsRealizados: 0, vendasMarketing: 0,
                qtdVendasPin: 0, qtdVendasMonitoramento: 0,
                qtdVendasInbound: 0, qtdVendasOutbound: 0,
                receitaTotal: 0, receitaPIN: 0, receitaMonitoramento: 0,
                roi: 0, cac: 0, ticketMedio: 0, cicloVendas: 0
            };

            const sheetMonthData = sheetData?.[selectedMonth] || {};
            return { ...defaultData, ...sheetMonthData };
        }

        function getFunilData() {
            const data = getCurrentMonthData();
            return [
                { label: 'Ligações Realizadas', valor: data.ligacoesRealizadas, cor: '#98a83f' },
                { label: 'Ligações Atendidas', valor: data.ligacoesAtendidas, cor: '#a8b84f' },
                { label: 'Formulário Respondido', valor: data.formularioRespondido, cor: '#b5d909' },
                { label: 'Análise Positiva', valor: data.analisePositiva, cor: '#82a002' },
                { label: 'Vendas', valor: data.vendas, cor: '#46580f' }
            ];
        }

        function getMarketingFunilData() {
            const data = getCurrentMonthData();
            return [
                { label: 'Visitantes', valor: data.visitantes, cor: '#d3f328' },
                { label: 'Cadastros', valor: data.cadastros, cor: '#b5d909' },
                { label: 'Oportunidades', valor: data.mqls, cor: '#a8b84f' },
                { label: 'Respostas Formulário', valor: data.respostaFormulario, cor: '#98a83f' },
                { label: 'Análises Positivas', valor: data.analisePositivaMarketing, cor: '#82a002' },
                { label: 'Pitchs Agendados', valor: data.pitchsAgendados, cor: '#6b8e23' },
                { label: 'Pitchs Realizados', valor: data.pitchsRealizados, cor: '#556b2f' },
                { label: 'Vendas', valor: data.vendasMarketing, cor: '#46580f' }
            ];
        }

        function calcularTaxa(atual, anterior) {
            if (!anterior || anterior === 0) return '0.00%';
            return ((atual / anterior) * 100).toFixed(2) + '%';
        }


        function renderComercialPage() {
            const data = getCurrentMonthData();
            const funilData = getFunilData();
            const taxaConversao = data.ligacoesRealizadas > 0
                ? ((data.vendas / data.ligacoesRealizadas) * 100).toFixed(2)
                : '0.00';

            return `
                <div style="display: grid; grid-template-columns: 40% 60%; gap: 24px; height: calc(100vh - 110px);">
                    <!-- COLUNA ESQUERDA: KPIs -->
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-content: start;">
                        <!-- Vendas -->
                        <div class="card">
                            <div class="card-label">💰 Vendas</div>
                            <div class="card-value" style="color: #46580f;">${data.vendas}</div>
                        </div>

                        <!-- Análise Positiva -->
                        <div class="card">
                            <div class="card-label">✓ Análise +</div>
                            <div class="card-value" style="color: #82a002;">${data.analisePositiva}</div>
                        </div>

                        <!-- Ligações Realizadas -->
                        <div class="card">
                            <div class="card-label">📞 Ligações</div>
                            <div class="card-value" style="color: #98a83f;">${data.ligacoesRealizadas}</div>
                        </div>

                        <!-- Taxa de Conversão -->
                        <div class="card">
                            <div class="card-label">% Conversão</div>
                            <div class="card-value" style="color: #b5d909;">${taxaConversao}%</div>
                        </div>

                        <!-- Ligações Atendidas -->
                        <div class="card">
                            <div class="card-label">✓ Atendidas</div>
                            <div class="card-value" style="color: #a8b84f; font-size: 2.5rem;">${data.ligacoesAtendidas}</div>
                        </div>

                        <!-- Formulário Respondido -->
                        <div class="card">
                            <div class="card-label">📋 Formulário</div>
                            <div class="card-value" style="color: #b5d909; font-size: 2.5rem;">${data.formularioRespondido}</div>
                        </div>
                    </div>

                    <!-- COLUNA DIREITA: Funil de Conversão -->
                    <div class="card" style="padding: 24px;">
                        <h3 style="font-size: 1.5rem; color: #b5d909; margin-bottom: 20px; text-align: center; font-weight: bold;">
                            FUNIL DE CONVERSÃO
                        </h3>
                        <div style="display: flex; flex-direction: column; gap: 12px;">
                            ${funilData.map((item, idx) => {
                                const taxa = idx > 0 ? calcularTaxa(item.valor, funilData[idx - 1].valor) : '100.00%';
                                const percentual = data.ligacoesRealizadas > 0 ? (item.valor / data.ligacoesRealizadas * 100) : 0;
                                return `
                                    <div class="funil-bar" style="border-left-color: ${item.cor};">
                                        <div>
                                            <div class="funil-label">${item.label}</div>
                                            <div class="progress-wrapper" style="width: 350px; margin-top: 6px;">
                                                <div class="progress-fill" style="width: ${percentual}%; background-color: ${item.cor};"></div>
                                            </div>
                                        </div>
                                        <div style="display: flex; align-items: center; gap: 16px;">
                                            <span class="funil-taxa">${taxa}</span>
                                            <span class="funil-value" style="color: ${item.cor};">${item.valor}</span>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                        <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(130, 160, 2, 0.2); text-align: center;">
                            <span style="color: rgba(181, 217, 9, 0.6); font-size: 0.9rem;">
                                Taxa de Conversão Total: ${taxaConversao}% | ${data.vendas} vendas de ${data.ligacoesRealizadas} ligações
                            </span>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderMarketingPage() {
            const data = getCurrentMonthData();
            const funilData = getMarketingFunilData();

            return `
                <div style="display: grid; grid-template-columns: 25% 50% 25%; gap: 20px; height: calc(100vh - 110px);">
                    <!-- COLUNA 1: KPIs -->
                    <div style="display: flex; flex-direction: column; gap: 16px;">
                        <!-- Investimento -->
                        <div class="card">
                            <div class="card-label">💰 Investimento</div>
                            <div class="card-value" style="color: #d3f328; font-size: 2rem;">R$ ${(data.investimento/1000).toFixed(0)}k</div>
                        </div>

                        <!-- Cadastros -->
                        <div class="card">
                            <div class="card-label">📝 Cadastros</div>
                            <div class="card-value" style="color: #b5d909; font-size: 2.5rem;">${data.cadastros}</div>
                        </div>

                        <!-- MQLs -->
                        <div class="card">
                            <div class="card-label">🎯 MQLs</div>
                            <div class="card-value" style="color: #82a002; font-size: 2.5rem;">${data.mqls}</div>
                        </div>

                        <!-- Vendas Marketing -->
                        <div class="card">
                            <div class="card-label">✓ Vendas</div>
                            <div class="card-value" style="color: #46580f; font-size: 2.5rem;">${data.vendasMarketing}</div>
                        </div>
                    </div>

                    <!-- COLUNA 2: Funil Marketing (8 níveis) -->
                    <div class="card" style="padding: 20px; overflow-y: auto;">
                        <h3 style="font-size: 1.3rem; color: #b5d909; margin-bottom: 16px; text-align: center; font-weight: bold;">
                            FUNIL DE MARKETING
                        </h3>
                        <div style="display: flex; flex-direction: column; gap: 8px;">
                            ${funilData.map((item, idx) => {
                                const taxa = idx > 0 ? calcularTaxa(item.valor, funilData[idx - 1].valor) : '100.00%';
                                return `
                                    <div class="funil-bar" style="border-left-color: ${item.cor}; padding: 8px 16px;">
                                        <div class="funil-label" style="font-size: 0.9rem;">${item.label}</div>
                                        <div style="display: flex; align-items: center; gap: 12px;">
                                            <span class="funil-taxa" style="font-size: 0.8rem;">${taxa}</span>
                                            <span class="funil-value" style="color: ${item.cor}; font-size: 1.5rem;">${item.valor}</span>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <!-- COLUNA 3: Análise Detalhada (barras de progresso) -->
                    <div class="card" style="padding: 20px; overflow-y: auto;">
                        <h3 style="font-size: 1.1rem; color: #b5d909; margin-bottom: 16px; font-weight: bold;">
                            ANÁLISE
                        </h3>
                        <div style="display: flex; flex-direction: column; gap: 16px;">
                            ${funilData.map((item) => {
                                const percentual = data.visitantes > 0 ? (item.valor / data.visitantes * 100) : 0;
                                return `
                                    <div>
                                        <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                                            <span style="color: rgba(181, 217, 9, 0.7); font-size: 0.75rem; font-weight: 600;">${item.label}</span>
                                            <span style="color: ${item.cor}; font-size: 0.9rem; font-weight: bold;">${item.valor}</span>
                                        </div>
                                        <div class="progress-wrapper">
                                            <div class="progress-fill" style="width: ${percentual}%; background-color: ${item.cor};"></div>
                                        </div>
                                        <div style="text-align: right; margin-top: 4px;">
                                            <span style="color: rgba(181, 217, 9, 0.5); font-size: 0.7rem;">${percentual.toFixed(1)}%</span>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderFinanceiroPage() {
            const data = getCurrentMonthData();

            return `
                <div style="display: flex; flex-direction: column; gap: 16px; height: calc(100vh - 110px);">
                    <!-- LINHA 1: Receita Total (destaque) -->
                    <div class="card" style="padding: 24px; text-align: center; border-left: 4px solid #82a002;">
                        <div class="card-label">💰 RECEITA TOTAL</div>
                        <div style="font-size: 3.5rem; font-weight: bold; color: #82a002; text-shadow: 0 0 20px rgba(130, 160, 2, 0.3);">
                            R$ ${(data.receitaTotal/1000).toFixed(0)}k
                        </div>
                    </div>

                    <!-- LINHA 2: Grid 4 colunas -->
                    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;">
                        <!-- Receita PIN -->
                        <div class="card" style="border-left: 4px solid #b5d909;">
                            <div class="card-label">Receita PIN</div>
                            <div class="card-value" style="color: #b5d909; font-size: 2rem;">R$ ${(data.receitaPIN/1000).toFixed(0)}k</div>
                        </div>

                        <!-- Receita Monitoramento -->
                        <div class="card" style="border-left: 4px solid #98a83f;">
                            <div class="card-label">Rec. Monitor.</div>
                            <div class="card-value" style="color: #98a83f; font-size: 2rem;">R$ ${(data.receitaMonitoramento/1000).toFixed(0)}k</div>
                        </div>

                        <!-- CAC -->
                        <div class="card" style="border-left: 4px solid #d3f328;">
                            <div class="card-label">CAC</div>
                            <div class="card-value" style="color: #d3f328; font-size: 2rem;">R$ ${data.cac.toFixed(0)}</div>
                        </div>

                        <!-- ROI -->
                        <div class="card" style="border-left: 4px solid #46580f;">
                            <div class="card-label">ROI</div>
                            <div class="card-value" style="color: #46580f; font-size: 2rem;">${data.roi.toFixed(2)}</div>
                        </div>
                    </div>

                    <!-- LINHA 3: Grid 4 colunas - Quantidade de Vendas -->
                    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;">
                        <!-- Qtd Vendas PIN -->
                        <div class="card" style="border-left: 4px solid #a8b84f;">
                            <div class="card-label">Vendas PIN</div>
                            <div class="card-value" style="color: #a8b84f; font-size: 2.5rem;">${data.qtdVendasPin}</div>
                        </div>

                        <!-- Qtd Vendas Monitoramento -->
                        <div class="card" style="border-left: 4px solid #98a83f;">
                            <div class="card-label">Vendas Monitor.</div>
                            <div class="card-value" style="color: #98a83f; font-size: 2.5rem;">${data.qtdVendasMonitoramento}</div>
                        </div>

                        <!-- Qtd Vendas Inbound -->
                        <div class="card" style="border-left: 4px solid #82a002;">
                            <div class="card-label">Vendas Inbound</div>
                            <div class="card-value" style="color: #82a002; font-size: 2.5rem;">${data.qtdVendasInbound}</div>
                        </div>

                        <!-- Qtd Vendas Outbound -->
                        <div class="card" style="border-left: 4px solid #6b8e23;">
                            <div class="card-label">Vendas Outbound</div>
                            <div class="card-value" style="color: #6b8e23; font-size: 2.5rem;">${data.qtdVendasOutbound}</div>
                        </div>
                    </div>

                    <!-- LINHA 4: Grid 2 colunas - Ticket Médio e Ciclo -->
                    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px;">
                        <!-- Ticket Médio -->
                        <div class="card" style="border-left: 4px solid #6b8e23; padding: 28px;">
                            <div class="card-label">💳 TICKET MÉDIO</div>
                            <div class="card-value" style="color: #6b8e23; font-size: 2.5rem;">R$ ${(data.ticketMedio/1000).toFixed(1)}k</div>
                        </div>

                        <!-- Ciclo de Vendas -->
                        <div class="card" style="border-left: 4px solid #556b2f; padding: 28px;">
                            <div class="card-label">⏱️ CICLO DE VENDAS</div>
                            <div class="card-value" style="color: #556b2f; font-size: 2.5rem;">${data.cicloVendas} <span style="font-size: 1.5rem;">dias</span></div>
                        </div>
                    </div>
                </div>
            `;
        }

        function render() {
            let pageContent;
            if (currentPage === 'comercial') {
                pageContent = renderComercialPage();
            } else if (currentPage === 'marketing') {
                pageContent = renderMarketingPage();
            } else if (currentPage === 'financeiro') {
                pageContent = renderFinanceiroPage();
            }

            document.getElementById('app').innerHTML = `
                <!-- HEADER HORIZONTAL -->
                <div class="header-bar">
                    <!-- Logo -->
                    <div class="logo-header">
                        <div>
                            <div class="logo-text">EMISFERA AGRO</div>
                            <div class="logo-subtitle">CRÉDITO DE CARBONO</div>
                        </div>
                    </div>

                    <!-- Navegação -->
                    <div class="nav-buttons">
                        <button type="button" data-page="comercial" class="nav-button ${currentPage === 'comercial' ? 'active' : ''}">
                            Comercial
                        </button>
                        <button type="button" data-page="marketing" class="nav-button ${currentPage === 'marketing' ? 'active' : ''}">
                            Marketing
                        </button>
                        <button type="button" data-page="financeiro" class="nav-button ${currentPage === 'financeiro' ? 'active' : ''}">
                            Financeiro
                        </button>
                    </div>

                    <!-- Header Right -->
                    <div class="header-right">
                        <select class="month-selector">
                            ${monthsAvailable.map(m => {
                                const ano = m.split('/')[1];
                                return `<option value="${m}" ${m === selectedMonth ? 'selected' : ''}>${monthNames[m]} ${ano}</option>`;
                            }).join('')}
                        </select>
                        <div>
                            <button class="update-btn" ${loading ? 'disabled' : ''}>
                                ${loading ? '🔄 Atualizando...' : '🔄 Atualizar'}
                            </button>
                            <div class="last-update">
                                ${loadError
                                    ? '<span style="color: #ff6b6b;">⚠ Erro ao carregar dados</span>'
                                    : lastUpdate.toLocaleTimeString('pt-BR')
                                }
                            </div>
                        </div>
                    </div>
                </div>

                <!-- CONTENT AREA -->
                <div class="content-area">
                    ${pageContent}
                </div>
            `;
        }

        // Event delegation para botões de navegação
        document.addEventListener('click', function(e) {
            const button = e.target.closest('button[data-page]');
            if (button) {
                e.preventDefault();
                e.stopPropagation();
                currentPage = button.getAttribute('data-page');
                render();
                return;
            }

            const updateButton = e.target.closest('button');
            if (updateButton && updateButton.textContent.includes('Atualizar')) {
                e.preventDefault();
                loadSheetData();
            }
        });

        // Event delegation para seletor de mês
        document.addEventListener('change', function(e) {
            if (e.target.tagName === 'SELECT') {
                selectedMonth = e.target.value;
                render();
            }
        });

        // Carregar dados ao iniciar
        loadSheetData();

        // Atualizar a cada 5 minutos
        setInterval(loadSheetData, 300000);
    </script>
</body>
</html>
