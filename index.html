<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; script-src * 'unsafe-inline' 'unsafe-eval'; connect-src * 'unsafe-inline'; img-src * data: blob: 'unsafe-inline'; frame-src *; style-src * 'unsafe-inline'; font-src * data:;">
    <title>Dashboard Emisfera | Comercial, Marketing & Financeiro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* PALETA EMISFERA */
        :root {
            --verde-principal:    #82a002;
            --verde-limao:        #b5d909;
            --verde-claro:        #d3f328;
            --verde-oliva:        #98a83f;
            --verde-escuro:       #46580f;
            --verde-muito-escuro: #253102;
            --cinza-claro:        #f5f7f9;
            --cinza-escuro:       #43474e;
            --amarelo-verde:      #e5fc5a;
            --verde-medio:        #a4ce3a;
        }

        /* DARK MODE - VERDE EMISFERA */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a140b;
            background-attachment: fixed;
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                repeating-linear-gradient(45deg, transparent, transparent 35px, rgba(130, 160, 2, 0.05) 35px, rgba(130, 160, 2, 0.05) 70px),
                repeating-linear-gradient(-45deg, transparent, transparent 35px, rgba(181, 217, 9, 0.03) 35px, rgba(181, 217, 9, 0.03) 70px);
            pointer-events: none;
            z-index: 0;
        }

        #app {
            position: relative;
            z-index: 1;
            height: 100vh;
            overflow: hidden;
        }

        /* HEADER HORIZONTAL COMPACTO */
        .header-bar {
            background: rgba(13, 27, 14, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(130, 160, 2, 0.2);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .logo-header {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: bold;
            color: #b5d909;
            letter-spacing: 0.5px;
        }

        .logo-subtitle {
            font-size: 0.7rem;
            color: rgba(181, 217, 9, 0.7);
            font-weight: 500;
            letter-spacing: 1px;
        }

        /* NAVEGAÇÃO */
        .nav-buttons {
            display: flex;
            gap: 8px;
        }

        .nav-button {
            cursor: pointer;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .nav-button:hover {
            transform: translateY(-2px);
        }

        .nav-button.active {
            background: linear-gradient(135deg, var(--verde-principal), var(--verde-limao));
            color: #0a140b;
            box-shadow: 0 4px 14px rgba(229, 252, 90, 0.35);
        }

        .nav-button:not(.active) {
            background: rgba(26, 45, 20, 0.6);
            color: rgba(181, 217, 9, 0.85);
            border: 1px solid rgba(164, 206, 58, 0.4);
        }

        /* HEADER RIGHT */
        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .month-selector {
            background: rgba(26, 45, 20, 0.8);
            color: #e8f5e0;
            border: 1px solid rgba(130, 160, 2, 0.3);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            outline: none;
        }

        .month-selector:focus {
            border-color: #b5d909;
            box-shadow: 0 0 0 2px rgba(181, 217, 9, 0.2);
        }

        .update-btn {
            background: rgba(229, 252, 90, 0.12);
            color: var(--amarelo-verde);
            border: 1px solid rgba(229, 252, 90, 0.4);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .update-btn:hover {
            background: rgba(229, 252, 90, 0.22);
            box-shadow: 0 0 12px rgba(229, 252, 90, 0.25);
        }

        .last-update {
            font-size: 0.7rem;
            color: var(--cinza-escuro);
        }

        /* MAIN CONTENT AREA */
        .content-area {
            height: calc(100vh - 70px);
            overflow-y: auto;
            padding: 20px;
        }

        .content-area::-webkit-scrollbar {
            width: 8px;
        }

        .content-area::-webkit-scrollbar-track {
            background: rgba(26, 45, 20, 0.3);
        }

        .content-area::-webkit-scrollbar-thumb {
            background: rgba(130, 160, 2, 0.5);
            border-radius: 4px;
        }

        /* CARDS GLASSMORPHISM */
        .card {
            background: rgba(26, 45, 20, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(130, 160, 2, 0.25);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        .card-value {
            font-size: 3rem;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.95; }
        }

        .card-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(229, 252, 90, 0.75);
            font-weight: 600;
        }

        /* FUNIL */
        .funil-bar {
            background: rgba(26, 45, 20, 0.6);
            border-radius: 8px;
            padding: 12px 20px;
            margin-bottom: 10px;
            border-left: 4px solid;
            transition: all 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .funil-bar:hover {
            transform: translateX(5px);
            box-shadow: 0 0 20px rgba(229, 252, 90, 0.18);
        }

        .funil-label {
            font-size: 1rem;
            color: #e8f5e0;
            font-weight: 600;
        }

        .funil-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.15);
        }

        .funil-taxa {
            font-size: 0.9rem;
            color: var(--cinza-escuro);
            margin-left: 12px;
        }

        /* PROGRESS BAR */
        .progress-wrapper {
            background: rgba(13, 27, 14, 0.6);
            border-radius: 8px;
            height: 8px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            border-radius: 8px;
            box-shadow: 0 0 8px currentColor;
            transition: width 1s ease;
        }

        /* TABELA DE SDRs */
        .sdr-table tbody .sdr-row {
            transition: all 0.3s ease;
        }

        .sdr-table tbody .sdr-row:hover {
            background: rgba(130, 160, 2, 0.15);
            transform: translateX(3px);
        }

        /* RESPONSIVIDADE PARA TELAS PEQUENAS */
        @media (max-width: 1200px) {
            .sdr-table {
                font-size: 0.85rem;
            }

            .sdr-table th,
            .sdr-table td {
                padding: 12px !important;
            }

            .sdr-table td[style*="font-size: 1.8rem"] {
                font-size: 1.4rem !important;
            }

            .sdr-table td[style*="font-size: 2rem"] {
                font-size: 1.6rem !important;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // URL da API (Vercel Serverless Function)
        const API_URL = '/api/dados';

        const monthsAvailable = [
            'maio/2025', 'junho/2025', 'julho/2025', 'agosto/2025',
            'setembro/2025', 'outubro/2025', 'novembro/2025', 'dezembro/2025',
            'janeiro/2026', 'fevereiro/2026', 'marco/2026', 'abril/2026',
            'maio/2026', 'junho/2026', 'julho/2026', 'agosto/2026',
            'setembro/2026', 'outubro/2026', 'novembro/2026', 'dezembro/2026'
        ];

        const monthNames = {
            'maio/2025': 'Maio', 'junho/2025': 'Junho', 'julho/2025': 'Julho', 'agosto/2025': 'Agosto',
            'setembro/2025': 'Setembro', 'outubro/2025': 'Outubro', 'novembro/2025': 'Novembro', 'dezembro/2025': 'Dezembro',
            'janeiro/2026': 'Janeiro', 'fevereiro/2026': 'Fevereiro', 'marco/2026': 'Março', 'abril/2026': 'Abril',
            'maio/2026': 'Maio', 'junho/2026': 'Junho', 'julho/2026': 'Julho', 'agosto/2026': 'Agosto',
            'setembro/2026': 'Setembro', 'outubro/2026': 'Outubro', 'novembro/2026': 'Novembro', 'dezembro/2026': 'Dezembro'
        };

        // Determina o mês padrão com base na data atual
        function getDefaultMonth() {
            const now = new Date();
            const monthKeys = [
                'janeiro', 'fevereiro', 'marco', 'abril', 'maio', 'junho',
                'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'
            ];
            const key = monthKeys[now.getMonth()] + '/' + now.getFullYear();
            return monthsAvailable.includes(key) ? key : monthsAvailable[monthsAvailable.length - 1];
        }

        let selectedMonth = getDefaultMonth();
        let sheetData = null;
        let loading = false;
        let loadError = false;
        let lastUpdate = new Date();
        let currentPage = 'resumo'; // 'resumo', 'comercial', 'marketing' ou 'financeiro'

        async function loadSheetData() {
            loading = true;
            loadError = false;
            render();
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 15000);
                const response = await fetch(API_URL, { signal: controller.signal });
                clearTimeout(timeoutId);
                sheetData = await response.json();
                lastUpdate = new Date();

                // DIAGNÓSTICO: Log da estrutura de dados recebida
                console.log('✅ Dados recebidos do Google Sheets');
                if (sheetData && Object.keys(sheetData).length > 0) {
                    const firstMonth = Object.keys(sheetData)[0];
                    console.log('Estrutura do primeiro mês:', Object.keys(sheetData[firstMonth]));

                    // Detectar versão do Google Apps Script
                    if (sheetData[firstMonth].vendas !== undefined && sheetData[firstMonth].vendasTotal === undefined) {
                        console.warn('⚠ Versão antiga detectada - usando fallback de compatibilidade');
                        console.warn('Atualize o Google Apps Script: docs/ATUALIZAR_GOOGLE_APPS_SCRIPT.md');
                    } else if (sheetData[firstMonth].vendasTotal !== undefined) {
                        console.log('✅ Versão correta detectada');
                    }
                }
            } catch (error) {
                console.error('Erro ao carregar dados:', error);
                loadError = true;
            }
            loading = false;
            render();
        }

        function getCurrentMonthData() {
            const defaultData = {
                ligacoesRealizadas: 0, ligacoesAtendidas: 0,
                formularioRespondido: 0, analisePositiva: 0, vendas: 0,
                investimento: 0, visitantes: 0, cadastros: 0, mqls: 0,
                respostaFormulario: 0, analisePositivaMarketing: 0,
                pitchsAgendados: 0, pitchsRealizados: 0, vendasMarketing: 0,
                qtdVendasPin: 0, qtdVendasMonitoramento: 0,
                qtdVendasInbound: 0, qtdVendasOutbound: 0,
                receitaTotal: 0, receitaPIN: 0, receitaMonitoramento: 0,
                roi: 0, cac: 0, ticketMedio: 0, cicloVendas: 0,
                // Novos campos para página Resumo (mapeamento direto das linhas)
                vendasTotal: 0,           // Linha 16
                oportunidades1: 0,        // Linha 6
                oportunidades2: 0,        // Linha 7
                analises: 0,              // Linha 11
                analisesPositivas: 0,     // Linha 12
                ticketMedioPIN: 0,        // Linha 24
                ticketMedioMonit: 0       // Linha 35
            };

            const sheetMonthData = sheetData?.[selectedMonth] || {};

            // VALIDAÇÃO: Detectar formato antigo do Google Apps Script e mapear automaticamente
            if (sheetMonthData.vendas !== undefined && sheetMonthData.vendasTotal === undefined) {
                console.warn('⚠ Google Apps Script está usando formato ANTIGO - mapeando automaticamente');
                console.warn('Por favor, atualize o Google Apps Script com a versão de apps-script.gs');

                // Mapear formato antigo → novo
                const mapped = {
                    ...sheetMonthData,
                    vendasTotal: sheetMonthData.vendas || 0,
                    oportunidades1: sheetMonthData.mqls || 0,
                    oportunidades2: 0,
                    analises: sheetMonthData.formularioRespondido || 0,
                    analisesPositivas: sheetMonthData.analisePositiva || 0
                };

                return { ...defaultData, ...mapped };
            }

            return { ...defaultData, ...sheetMonthData };
        }

        // FUNÇÃO: Obter dados dos SDRs do mês atual
        function getSDRData() {
            const data = getCurrentMonthData();

            // Dados mockados temporários (Fase 1 - será substituído por dados reais da planilha)
            const defaultSDRs = [
                { nome: 'Maisa', analises: 45, analisesPositivas: 32, vendas: 8 },
                { nome: 'Gabriela', analises: 52, analisesPositivas: 38, vendas: 12 },
                { nome: 'Juliana', analises: 38, analisesPositivas: 28, vendas: 6 },
                { nome: 'Marlon', analises: 41, analisesPositivas: 30, vendas: 9 }
            ];

            // Se dados reais existirem (após Fase 2), usar; senão usar mockados
            if (data.sdrs) {
                return [
                    { nome: 'Maisa', ...data.sdrs.maisa },
                    { nome: 'Gabriela', ...data.sdrs.gabriela },
                    { nome: 'Juliana', ...data.sdrs.juliana },
                    { nome: 'Marlon', ...data.sdrs.marlon }
                ];
            }

            return defaultSDRs;
        }

        function getFunilData() {
            const data = getCurrentMonthData();
            return [
                { label: 'Ligações Realizadas', valor: data.ligacoesRealizadas, cor: '#98a83f' },
                { label: 'Ligações Atendidas', valor: data.ligacoesAtendidas, cor: '#a4ce3a' },
                { label: 'Formulário Respondido', valor: data.formularioRespondido, cor: '#b5d909' },
                { label: 'Análise Positiva', valor: data.analisePositiva, cor: '#82a002' },
                { label: 'Vendas', valor: data.vendas, cor: '#46580f' }
            ];
        }

        function getMarketingFunilData() {
            const data = getCurrentMonthData();
            return [
                { label: 'Visitantes', valor: data.visitantes, cor: '#d3f328' },
                { label: 'Cadastros', valor: data.cadastros, cor: '#b5d909' },
                { label: 'Oportunidades', valor: data.mqls, cor: '#a4ce3a' },
                { label: 'Respostas Formulário', valor: data.respostaFormulario, cor: '#98a83f' },
                { label: 'Análises Positivas', valor: data.analisePositivaMarketing, cor: '#82a002' },
                { label: 'Pitchs Agendados', valor: data.pitchsAgendados, cor: '#46580f' },
                { label: 'Pitchs Realizados', valor: data.pitchsRealizados, cor: '#253102' },
                { label: 'Vendas', valor: data.vendasMarketing, cor: '#46580f' }
            ];
        }

        function calcularTaxa(atual, anterior) {
            if (!anterior || anterior === 0) return '0.00%';
            return ((atual / anterior) * 100).toFixed(2) + '%';
        }


        function renderResumoPage() {
            const data = getCurrentMonthData();

            // Métricas agregadas (mapeamento direto das linhas do Google Sheets)
            const totalVendas = data.vendasTotal;                      // Linha 16
            const oportunidades = data.oportunidades1 + data.oportunidades2; // Linha 6 + Linha 7
            const analises = data.analises;                            // Linha 11
            const analisesPositivas = data.analisesPositivas;          // Linha 12
            const reunioesAgendadas = data.pitchsAgendados;            // Linha 14
            const reunioesFeitas = data.pitchsRealizados;              // Linha 15

            // Ticket médio PIN e Monitoramento (direto da planilha)
            const ticketMedioPIN = data.ticketMedioPIN;                // Linha 24
            const ticketMedioMonit = data.ticketMedioMonit;            // Linha 35

            return `
                <div style="display: flex; flex-direction: column; gap: 20px; height: calc(100vh - 110px); overflow-y: auto; padding-right: 10px;">
                    <!-- LINHA 1: KPIs Principais (6 cards) -->
                    <div style="display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px;">
                        <div class="card" style="border-left: 4px solid #82a002; padding: 16px;">
                            <div class="card-label" style="font-size: 0.7rem;">Vendas Total</div>
                            <div class="card-value" style="font-size: 2.2rem;">${totalVendas}</div>
                        </div>
                        <div class="card" style="border-left: 4px solid #a4ce3a; padding: 16px;">
                            <div class="card-label" style="font-size: 0.7rem;">Oportunidades</div>
                            <div class="card-value" style="font-size: 2.2rem;">${oportunidades}</div>
                        </div>
                        <div class="card" style="border-left: 4px solid #b5d909; padding: 16px;">
                            <div class="card-label" style="font-size: 0.7rem;">Análises</div>
                            <div class="card-value" style="font-size: 2.2rem;">${analises}</div>
                        </div>
                        <div class="card" style="border-left: 4px solid #98a83f; padding: 16px;">
                            <div class="card-label" style="font-size: 0.7rem;">Análises +</div>
                            <div class="card-value" style="font-size: 2.2rem;">${analisesPositivas}</div>
                        </div>
                        <div class="card" style="border-left: 4px solid #46580f; padding: 16px;">
                            <div class="card-label" style="font-size: 0.7rem;">Reuniões Agend.</div>
                            <div class="card-value" style="font-size: 2.2rem;">${reunioesAgendadas}</div>
                        </div>
                        <div class="card" style="border-left: 4px solid #253102; padding: 16px;">
                            <div class="card-label" style="font-size: 0.7rem;">Reuniões Feitas</div>
                            <div class="card-value" style="font-size: 2.2rem;">${reunioesFeitas}</div>
                        </div>
                    </div>

                    <!-- LINHA 2: Grid com 3 colunas - PIN, FUNIL, MONITORAMENTO -->
                    <div style="display: grid; grid-template-columns: 25% 50% 25%; gap: 20px; flex: 1;">
                        <!-- COLUNA ESQUERDA: Vendas PIN -->
                        <div class="card" style="padding: 20px; display: flex; flex-direction: column;">
                            <h3 style="font-size: 1.1rem; color: #b5d909; margin-bottom: 20px; text-align: center; font-weight: bold;">
                                VENDAS PIN
                            </h3>
                            <div style="display: flex; flex-direction: column; gap: 16px; flex: 1; justify-content: center;">
                                <div style="text-align: center; padding: 16px; background: rgba(26, 45, 20, 0.5); border-radius: 8px; border-left: 3px solid #82a002;">
                                    <div class="card-label" style="font-size: 0.75rem;">Quantidade</div>
                                    <div class="card-value" style="font-size: 2.5rem;">${data.qtdVendasPin}</div>
                                </div>
                                <div style="text-align: center; padding: 16px; background: rgba(26, 45, 20, 0.5); border-radius: 8px; border-left: 3px solid #b5d909;">
                                    <div class="card-label" style="font-size: 0.75rem;">Faturamento</div>
                                    <div class="card-value" style="font-size: 2rem;">R$ ${(data.receitaPIN/1000).toFixed(0)}k</div>
                                </div>
                                <div style="text-align: center; padding: 16px; background: rgba(26, 45, 20, 0.5); border-radius: 8px; border-left: 3px solid #98a83f;">
                                    <div class="card-label" style="font-size: 0.75rem;">Ticket Médio</div>
                                    <div class="card-value" style="font-size: 1.8rem;">R$ ${ticketMedioPIN > 1000 ? (ticketMedioPIN/1000).toFixed(1) + 'k' : ticketMedioPIN.toFixed(0)}</div>
                                </div>
                            </div>
                        </div>

                        <!-- COLUNA CENTRAL: Funil Completo -->
                        <div class="card" style="padding: 20px; overflow-y: auto;">
                            <h3 style="font-size: 1.3rem; color: #b5d909; margin-bottom: 16px; text-align: center; font-weight: bold;">
                                FUNIL COMPLETO
                            </h3>
                            <div style="display: flex; flex-direction: column; gap: 8px;">
                                ${[
                                    { label: 'Visitantes Site', valor: data.visitantes, cor: '#d3f328' },
                                    { label: 'Leads Totais', valor: data.cadastros, cor: '#b5d909' },
                                    { label: 'Oportunidades', valor: data.mqls, cor: '#a4ce3a' },
                                    { label: 'Análises', valor: analises, cor: '#98a83f' },
                                    { label: 'Análises Positivas', valor: analisesPositivas, cor: '#82a002' },
                                    { label: 'Reuniões Agendadas', valor: reunioesAgendadas, cor: '#46580f' },
                                    { label: 'Reuniões Realizadas', valor: reunioesFeitas, cor: '#253102' },
                                    { label: 'Vendas', valor: totalVendas, cor: '#e5fc5a' }
                                ].map((item, idx, arr) => {
                                    const taxa = idx > 0 ? calcularTaxa(item.valor, arr[idx - 1].valor) : '100%';
                                    const percentual = data.visitantes > 0 ? (item.valor / data.visitantes * 100) : 0;
                                    return `
                                        <div class="funil-bar" style="border-left-color: ${item.cor}; padding: 10px 16px;">
                                            <div>
                                                <div class="funil-label" style="font-size: 0.9rem;">${item.label}</div>
                                                <div class="progress-wrapper" style="width: 200px; margin-top: 4px;">
                                                    <div class="progress-fill" style="width: ${percentual}%; background-color: ${item.cor};"></div>
                                                </div>
                                            </div>
                                            <div style="display: flex; align-items: center; gap: 12px;">
                                                <span class="funil-taxa" style="font-size: 0.75rem;">${taxa}</span>
                                                <span class="funil-value" style="font-size: 1.5rem;">${item.valor}</span>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>

                        <!-- COLUNA DIREITA: Vendas Monitoramento -->
                        <div class="card" style="padding: 20px; display: flex; flex-direction: column;">
                            <h3 style="font-size: 1.1rem; color: #b5d909; margin-bottom: 20px; text-align: center; font-weight: bold;">
                                VENDAS MONITOR.
                            </h3>
                            <div style="display: flex; flex-direction: column; gap: 16px; flex: 1; justify-content: center;">
                                <div style="text-align: center; padding: 16px; background: rgba(26, 45, 20, 0.5); border-radius: 8px; border-left: 3px solid #82a002;">
                                    <div class="card-label" style="font-size: 0.75rem;">Quantidade</div>
                                    <div class="card-value" style="font-size: 2.5rem;">${data.qtdVendasMonitoramento}</div>
                                </div>
                                <div style="text-align: center; padding: 16px; background: rgba(26, 45, 20, 0.5); border-radius: 8px; border-left: 3px solid #b5d909;">
                                    <div class="card-label" style="font-size: 0.75rem;">Faturamento</div>
                                    <div class="card-value" style="font-size: 2rem;">R$ ${(data.receitaMonitoramento/1000).toFixed(0)}k</div>
                                </div>
                                <div style="text-align: center; padding: 16px; background: rgba(26, 45, 20, 0.5); border-radius: 8px; border-left: 3px solid #98a83f;">
                                    <div class="card-label" style="font-size: 0.75rem;">Ticket Médio</div>
                                    <div class="card-value" style="font-size: 1.8rem;">R$ ${ticketMedioMonit > 1000 ? (ticketMedioMonit/1000).toFixed(1) + 'k' : ticketMedioMonit.toFixed(0)}</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- LINHA 3: Tabela de SDRs -->
                    <div class="card" style="padding: 24px; margin-top: 20px;">
                        <h3 style="font-size: 1.3rem; color: #b5d909; margin-bottom: 20px; text-align: center; font-weight: bold;">
                            DESEMPENHO POR SDR
                        </h3>

                        <div style="overflow-x: auto;">
                            <table class="sdr-table" style="width: 100%; border-collapse: collapse;">
                                <thead>
                                    <tr style="border-bottom: 2px solid rgba(130, 160, 2, 0.5);">
                                        <th style="padding: 16px; text-align: left; font-size: 0.9rem; color: #e5fc5a; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">
                                            SDR
                                        </th>
                                        <th style="padding: 16px; text-align: center; font-size: 0.9rem; color: #e5fc5a; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">
                                            Análises
                                        </th>
                                        <th style="padding: 16px; text-align: center; font-size: 0.9rem; color: #e5fc5a; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">
                                            Análises Positivas
                                        </th>
                                        <th style="padding: 16px; text-align: center; font-size: 0.9rem; color: #e5fc5a; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">
                                            Vendas
                                        </th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${getSDRData().map((sdr, index) => {
                                        const cores = ['#82a002', '#b5d909', '#98a83f', '#a4ce3a'];
                                        const cor = cores[index % cores.length];

                                        return `
                                            <tr class="sdr-row" style="border-bottom: 1px solid rgba(130, 160, 2, 0.2);">
                                                <td style="padding: 20px; font-size: 1.1rem; color: #ffffff; font-weight: 600; border-left: 4px solid ${cor};">
                                                    ${sdr.nome}
                                                </td>
                                                <td style="padding: 20px; text-align: center; font-size: 1.8rem; color: #b5d909; font-weight: bold;">
                                                    ${sdr.analises}
                                                </td>
                                                <td style="padding: 20px; text-align: center; font-size: 1.8rem; color: #82a002; font-weight: bold;">
                                                    ${sdr.analisesPositivas}
                                                </td>
                                                <td style="padding: 20px; text-align: center; font-size: 1.8rem; color: #e5fc5a; font-weight: bold;">
                                                    ${sdr.vendas}
                                                </td>
                                            </tr>
                                        `;
                                    }).join('')}

                                    <!-- LINHA TOTAL -->
                                    <tr style="background: rgba(130, 160, 2, 0.15); border-top: 2px solid rgba(130, 160, 2, 0.5);">
                                        <td style="padding: 20px; font-size: 1.2rem; color: #e5fc5a; font-weight: 700; text-transform: uppercase;">
                                            TOTAL
                                        </td>
                                        <td style="padding: 20px; text-align: center; font-size: 2rem; color: #b5d909; font-weight: bold;">
                                            ${getSDRData().reduce((sum, sdr) => sum + sdr.analises, 0)}
                                        </td>
                                        <td style="padding: 20px; text-align: center; font-size: 2rem; color: #82a002; font-weight: bold;">
                                            ${getSDRData().reduce((sum, sdr) => sum + sdr.analisesPositivas, 0)}
                                        </td>
                                        <td style="padding: 20px; text-align: center; font-size: 2rem; color: #e5fc5a; font-weight: bold;">
                                            ${getSDRData().reduce((sum, sdr) => sum + sdr.vendas, 0)}
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderComercialPage() {
            const data = getCurrentMonthData();
            const funilData = getFunilData();
            const taxaConversao = data.ligacoesRealizadas > 0
                ? ((data.vendas / data.ligacoesRealizadas) * 100).toFixed(2)
                : '0.00';

            return `
                <div style="display: grid; grid-template-columns: 40% 60%; gap: 24px; height: calc(100vh - 110px);">
                    <!-- COLUNA ESQUERDA: KPIs -->
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-content: start;">
                        <!-- Vendas -->
                        <div class="card">
                            <div class="card-label">💰 Vendas</div>
                            <div class="card-value">${data.vendas}</div>
                        </div>

                        <!-- Análise Positiva -->
                        <div class="card">
                            <div class="card-label">✓ Análise +</div>
                            <div class="card-value">${data.analisePositiva}</div>
                        </div>

                        <!-- Ligações Realizadas -->
                        <div class="card">
                            <div class="card-label">📞 Ligações</div>
                            <div class="card-value">${data.ligacoesRealizadas}</div>
                        </div>

                        <!-- Taxa de Conversão -->
                        <div class="card">
                            <div class="card-label">% Conversão</div>
                            <div class="card-value">${taxaConversao}%</div>
                        </div>

                        <!-- Ligações Atendidas -->
                        <div class="card">
                            <div class="card-label">✓ Atendidas</div>
                            <div class="card-value" style="font-size: 2.5rem;">${data.ligacoesAtendidas}</div>
                        </div>

                        <!-- Formulário Respondido -->
                        <div class="card">
                            <div class="card-label">📋 Formulário</div>
                            <div class="card-value" style="font-size: 2.5rem;">${data.formularioRespondido}</div>
                        </div>
                    </div>

                    <!-- COLUNA DIREITA: Funil de Conversão -->
                    <div class="card" style="padding: 24px;">
                        <h3 style="font-size: 1.5rem; color: #b5d909; margin-bottom: 20px; text-align: center; font-weight: bold;">
                            FUNIL DE CONVERSÃO
                        </h3>
                        <div style="display: flex; flex-direction: column; gap: 12px;">
                            ${funilData.map((item, idx) => {
                                const taxa = idx > 0 ? calcularTaxa(item.valor, funilData[idx - 1].valor) : '100.00%';
                                const percentual = data.ligacoesRealizadas > 0 ? (item.valor / data.ligacoesRealizadas * 100) : 0;
                                return `
                                    <div class="funil-bar" style="border-left-color: ${item.cor};">
                                        <div>
                                            <div class="funil-label">${item.label}</div>
                                            <div class="progress-wrapper" style="width: 350px; margin-top: 6px;">
                                                <div class="progress-fill" style="width: ${percentual}%; background-color: ${item.cor};"></div>
                                            </div>
                                        </div>
                                        <div style="display: flex; align-items: center; gap: 16px;">
                                            <span class="funil-taxa">${taxa}</span>
                                            <span class="funil-value">${item.valor}</span>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                        <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(229, 252, 90, 0.2); text-align: center;">
                            <span style="color: #43474e; font-size: 0.9rem;">
                                Taxa de Conversão Total: ${taxaConversao}% | ${data.vendas} vendas de ${data.ligacoesRealizadas} ligações
                            </span>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderMarketingPage() {
            const data = getCurrentMonthData();
            const funilData = getMarketingFunilData();

            return `
                <div style="display: grid; grid-template-columns: 22% 40% 38%; gap: 20px; height: calc(100vh - 110px);">
                    <!-- COLUNA 1: KPIs -->
                    <div style="display: flex; flex-direction: column; gap: 16px;">
                        <!-- Investimento -->
                        <div class="card">
                            <div class="card-label">💰 Investimento</div>
                            <div class="card-value" style="font-size: 2rem;">R$ ${(data.investimento/1000).toFixed(0)}k</div>
                        </div>

                        <!-- Cadastros -->
                        <div class="card">
                            <div class="card-label">📝 Cadastros</div>
                            <div class="card-value" style="font-size: 2.5rem;">${data.cadastros}</div>
                        </div>

                        <!-- MQLs -->
                        <div class="card">
                            <div class="card-label">🎯 MQLs</div>
                            <div class="card-value" style="font-size: 2.5rem;">${data.mqls}</div>
                        </div>

                        <!-- Vendas Marketing -->
                        <div class="card">
                            <div class="card-label">✓ Vendas</div>
                            <div class="card-value" style="font-size: 2.5rem;">${data.vendasMarketing}</div>
                        </div>
                    </div>

                    <!-- COLUNA 2: Funil Marketing (8 níveis) -->
                    <div class="card" style="padding: 20px; overflow-y: auto;">
                        <h3 style="font-size: 1.3rem; color: #b5d909; margin-bottom: 16px; text-align: center; font-weight: bold;">
                            FUNIL DE MARKETING
                        </h3>
                        <div style="display: flex; flex-direction: column; gap: 8px;">
                            ${funilData.map((item, idx) => {
                                const taxa = idx > 0 ? calcularTaxa(item.valor, funilData[idx - 1].valor) : '100.00%';
                                return `
                                    <div class="funil-bar" style="border-left-color: ${item.cor}; padding: 8px 16px;">
                                        <div class="funil-label" style="font-size: 0.9rem;">${item.label}</div>
                                        <div style="display: flex; align-items: center; gap: 12px;">
                                            <span class="funil-taxa" style="font-size: 0.8rem;">${taxa}</span>
                                            <span class="funil-value" style="font-size: 1.5rem;">${item.valor}</span>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <!-- COLUNA 3: Análise Detalhada (barras de progresso) -->
                    <div class="card" style="padding: 20px; overflow-y: auto;">
                        <h3 style="font-size: 1.1rem; color: #b5d909; margin-bottom: 16px; font-weight: bold;">
                            ANÁLISE
                        </h3>
                        <div style="display: flex; flex-direction: column; gap: 16px;">
                            ${funilData.map((item) => {
                                const percentual = data.visitantes > 0 ? (item.valor / data.visitantes * 100) : 0;
                                return `
                                    <div>
                                        <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                                            <span style="color: #43474e; font-size: 0.75rem; font-weight: 600;">${item.label}</span>
                                            <span style="color: #ffffff; font-size: 0.9rem; font-weight: bold;">${item.valor}</span>
                                        </div>
                                        <div class="progress-wrapper">
                                            <div class="progress-fill" style="width: ${percentual}%; background-color: ${item.cor};"></div>
                                        </div>
                                        <div style="text-align: right; margin-top: 4px;">
                                            <span style="color: #43474e; font-size: 0.7rem;">${percentual.toFixed(1)}%</span>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderFinanceiroPage() {
            const data = getCurrentMonthData();

            return `
                <div style="display: flex; flex-direction: column; gap: 16px; height: calc(100vh - 110px);">
                    <!-- LINHA 1: Receita Total (destaque) -->
                    <div class="card" style="padding: 24px; text-align: center; border-left: 4px solid #e5fc5a;">
                        <div class="card-label">💰 RECEITA TOTAL</div>
                        <div style="font-size: 3.5rem; font-weight: bold; color: #ffffff; text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);">
                            R$ ${(data.receitaTotal/1000).toFixed(0)}k
                        </div>
                    </div>

                    <!-- LINHA 2: Grid 4 colunas -->
                    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;">
                        <!-- Receita PIN -->
                        <div class="card" style="border-left: 4px solid #b5d909;">
                            <div class="card-label">Receita PIN</div>
                            <div class="card-value" style="font-size: 2rem;">R$ ${(data.receitaPIN/1000).toFixed(0)}k</div>
                        </div>

                        <!-- Receita Monitoramento -->
                        <div class="card" style="border-left: 4px solid #98a83f;">
                            <div class="card-label">Rec. Monitor.</div>
                            <div class="card-value" style="font-size: 2rem;">R$ ${(data.receitaMonitoramento/1000).toFixed(0)}k</div>
                        </div>

                        <!-- CAC -->
                        <div class="card" style="border-left: 4px solid #d3f328;">
                            <div class="card-label">CAC</div>
                            <div class="card-value" style="font-size: 2rem;">R$ ${data.cac.toFixed(0)}</div>
                        </div>

                        <!-- ROI -->
                        <div class="card" style="border-left: 4px solid #46580f;">
                            <div class="card-label">ROI</div>
                            <div class="card-value" style="font-size: 2rem;">${data.roi.toFixed(2)}</div>
                        </div>
                    </div>

                    <!-- LINHA 3: Grid 4 colunas - Quantidade de Vendas -->
                    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;">
                        <!-- Qtd Vendas PIN -->
                        <div class="card" style="border-left: 4px solid #a4ce3a;">
                            <div class="card-label">Vendas PIN</div>
                            <div class="card-value" style="font-size: 2.5rem;">${data.qtdVendasPin}</div>
                        </div>

                        <!-- Qtd Vendas Monitoramento -->
                        <div class="card" style="border-left: 4px solid #98a83f;">
                            <div class="card-label">Vendas Monitor.</div>
                            <div class="card-value" style="font-size: 2.5rem;">${data.qtdVendasMonitoramento}</div>
                        </div>

                        <!-- Qtd Vendas Inbound -->
                        <div class="card" style="border-left: 4px solid #82a002;">
                            <div class="card-label">Vendas Inbound</div>
                            <div class="card-value" style="font-size: 2.5rem;">${data.qtdVendasInbound}</div>
                        </div>

                        <!-- Qtd Vendas Outbound -->
                        <div class="card" style="border-left: 4px solid #46580f;">
                            <div class="card-label">Vendas Outbound</div>
                            <div class="card-value" style="font-size: 2.5rem;">${data.qtdVendasOutbound}</div>
                        </div>
                    </div>

                    <!-- LINHA 4: Grid 2 colunas - Ticket Médio e Ciclo -->
                    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px;">
                        <!-- Ticket Médio -->
                        <div class="card" style="border-left: 4px solid #46580f; padding: 28px;">
                            <div class="card-label">💳 TICKET MÉDIO</div>
                            <div class="card-value" style="font-size: 2.5rem;">R$ ${(data.ticketMedio/1000).toFixed(1)}k</div>
                        </div>

                        <!-- Ciclo de Vendas -->
                        <div class="card" style="border-left: 4px solid #253102; padding: 28px;">
                            <div class="card-label">⏱️ CICLO DE VENDAS</div>
                            <div class="card-value" style="font-size: 2.5rem;">${data.cicloVendas} <span style="font-size: 1.5rem;">dias</span></div>
                        </div>
                    </div>
                </div>
            `;
        }

        function render() {
            let pageContent;
            if (currentPage === 'resumo') {
                pageContent = renderResumoPage();
            } else if (currentPage === 'comercial') {
                pageContent = renderComercialPage();
            } else if (currentPage === 'marketing') {
                pageContent = renderMarketingPage();
            } else if (currentPage === 'financeiro') {
                pageContent = renderFinanceiroPage();
            }

            document.getElementById('app').innerHTML = `
                <!-- HEADER HORIZONTAL -->
                <div class="header-bar">
                    <!-- Logo -->
                    <div class="logo-header">
                        <div>
                            <div class="logo-text">EMISFERA AGRO</div>
                            <div class="logo-subtitle">CRÉDITO DE CARBONO</div>
                        </div>
                    </div>

                    <!-- Navegação -->
                    <div class="nav-buttons">
                        <button type="button" data-page="resumo" class="nav-button ${currentPage === 'resumo' ? 'active' : ''}">
                            Resumo
                        </button>
                        <button type="button" data-page="comercial" class="nav-button ${currentPage === 'comercial' ? 'active' : ''}">
                            Comercial
                        </button>
                        <button type="button" data-page="marketing" class="nav-button ${currentPage === 'marketing' ? 'active' : ''}">
                            Marketing
                        </button>
                        <button type="button" data-page="financeiro" class="nav-button ${currentPage === 'financeiro' ? 'active' : ''}">
                            Financeiro
                        </button>
                    </div>

                    <!-- Header Right -->
                    <div class="header-right">
                        <select class="month-selector">
                            ${monthsAvailable.map(m => {
                                const ano = m.split('/')[1];
                                return `<option value="${m}" ${m === selectedMonth ? 'selected' : ''}>${monthNames[m]} ${ano}</option>`;
                            }).join('')}
                        </select>
                        <div>
                            <button class="update-btn" ${loading ? 'disabled' : ''}>
                                ${loading ? '🔄 Atualizando...' : '🔄 Atualizar'}
                            </button>
                            <div class="last-update">
                                ${loadError
                                    ? '<span style="color: #ff6b6b;">⚠ Erro ao carregar dados</span>'
                                    : lastUpdate.toLocaleTimeString('pt-BR')
                                }
                            </div>
                        </div>
                    </div>
                </div>

                <!-- CONTENT AREA -->
                <div class="content-area">
                    ${pageContent}
                </div>
            `;
        }

        // Event delegation para botões de navegação
        document.addEventListener('click', function(e) {
            const button = e.target.closest('button[data-page]');
            if (button) {
                e.preventDefault();
                e.stopPropagation();
                currentPage = button.getAttribute('data-page');
                render();
                return;
            }

            const updateButton = e.target.closest('button');
            if (updateButton && updateButton.textContent.includes('Atualizar')) {
                e.preventDefault();
                loadSheetData();
            }
        });

        // Event delegation para seletor de mês
        document.addEventListener('change', function(e) {
            if (e.target.tagName === 'SELECT') {
                selectedMonth = e.target.value;
                render();
            }
        });

        // Carregar dados ao iniciar
        loadSheetData();

        // Atualizar a cada 5 minutos
        setInterval(loadSheetData, 300000);
    </script>
</body>
</html>
